<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Picker Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;800&display=swap">
<style>
/* Three labeled steps in one card: 1 items in each order, 2 how many orders, 3 create. Recent orders below. */
:root {
  --bg: #f4f5f7; --card: #ffffff; --ink: #0f1215; --muted: #6b7380; --line: #e3e6ea; --soft: #eef0f3;
  --ok: #15803d; --ok-bg: #dcfce7; --bad: #b91c1c; --bad-bg: #fee2e2; --pend: #a16207; --pend-bg: #fef3c7;
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0e11; --card: #161a1f; --ink: #f2f4f6; --muted: #8f98a3; --line: #262c34; --soft: #1f252c;
    --ok: #4ade80; --ok-bg: #11301d; --bad: #f87171; --bad-bg: #3b1515; --pend: #fbbf24; --pend-bg: #3a2b08;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0e11; --card: #161a1f; --ink: #f2f4f6; --muted: #8f98a3; --line: #262c34; --soft: #1f252c;
  --ok: #4ade80; --ok-bg: #11301d; --bad: #f87171; --bad-bg: #3b1515; --pend: #fbbf24; --pend-bg: #3a2b08;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 500 15px/1.4 var(--font);
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
img { max-width: 100%; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 24px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status.on i { background: var(--ok); }
.status.off i { background: var(--bad); }
.pin { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.btn.small { width: auto; min-height: 36px; padding: 6px 12px; font-size: 13px; border-radius: 9px; }
.confirm { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; background: var(--soft); border-radius: 10px; padding: 6px 8px 6px 12px; }
.pin input { width: 5.5em; font: 600 15px var(--mono); padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }

.step { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
.step b { width: 20px; height: 20px; border-radius: 50%; background: var(--ink); color: var(--bg); font-size: 11px; display: grid; place-items: center; }

/* Composer card */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; display: grid; grid-template-columns: 1.4fr 1fr; }
.panel > div { padding: 18px; min-width: 0; }
.panel > div + div { border-left: 1px solid var(--line); }

.seg { display: inline-grid; grid-auto-flow: column; background: var(--soft); border-radius: 10px; padding: 3px; margin-bottom: 12px; }
.seg button { border: 0; background: transparent; border-radius: 8px; padding: 7px 14px; font-weight: 700; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 13px; }
.chips button:hover:not(:disabled) { border-color: var(--ink); }
.chips button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.presets { margin-bottom: 12px; }
.hint { color: var(--muted); font-size: 13px; margin: 0 0 8px; }

.plist { display: grid; gap: 6px; }
.prow { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px 6px 6px; }
.prow.on { border-color: var(--ink); }
.prow .pic { width: 44px; height: 44px; border-radius: 8px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; }
.prow .pic img { width: 100%; height: 100%; object-fit: contain; padding: 3px; }
.prow .nm { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stp { display: inline-grid; grid-template-columns: 36px 36px 36px; align-items: center; }
.stp button { height: 36px; border: 1px solid var(--line); background: var(--card); font-weight: 800; font-size: 16px; padding: 0; }
.stp button:first-child { border-radius: 9px 0 0 9px; }
.stp button:last-child { border-radius: 0 9px 9px 0; }
.stp output { text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }
.random-note { border: 1px dashed var(--line); border-radius: 12px; padding: 14px; color: var(--muted); font-size: 14px; }

.counter { display: grid; grid-template-columns: 48px 1fr 48px; margin-bottom: 10px; }
.counter button { height: 52px; border: 1px solid var(--line); background: var(--card); font-size: 22px; font-weight: 800; padding: 0; }
.counter button:first-child { border-radius: 12px 0 0 12px; }
.counter button:last-child { border-radius: 0 12px 12px 0; }
.counter input { height: 52px; border: 1px solid var(--line); border-left: 0; border-right: 0; background: var(--card); text-align: center; font-size: 24px; font-weight: 800; width: 100%; min-width: 0; -moz-appearance: textfield; }
.counter input::-webkit-outer-spin-button, .counter input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

.summary { margin: 18px 0 10px; font-size: 14px; color: var(--muted); min-height: 1.4em; }
.btn { width: 100%; border: 0; border-radius: 12px; padding: 14px 18px; font-weight: 800; font-size: 16px; background: var(--ink); color: var(--bg); min-height: 52px; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.result { margin-top: 10px; font-size: 13px; font-weight: 700; min-height: 1.3em; }
.result.ok { color: var(--ok); }
.result.bad { color: var(--bad); }
.bar { height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; margin-top: 10px; }
.bar i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .2s; }
.spin { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.35); border-top-color: var(--bg); border-radius: 50%; display: inline-block; vertical-align: -2px; margin-right: 6px; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Recent orders */
.list { display: grid; gap: 6px; }
.row { display: grid; grid-template-columns: auto 1fr auto auto; grid-template-areas: "num it pill link"; align-items: center; gap: 10px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.row.new { border-color: var(--ok); }
.row .num { grid-area: num; font: 800 14px var(--mono); letter-spacing: .02em; white-space: nowrap; }
.row .it { grid-area: it; color: var(--muted); font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { grid-area: pill; justify-self: start; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: var(--soft); color: var(--muted); }
.pill.pending, .pill.training { background: var(--pend-bg); color: var(--pend); }
.pill.fulfilled, .pill.new { background: var(--ok-bg); color: var(--ok); }
.pill.canceled { background: var(--bad-bg); color: var(--bad); }
.row a { grid-area: link; color: var(--ink); font-weight: 800; text-decoration: none; font-size: 13px; }
.row a:hover { text-decoration: underline; }
.empty { color: var(--muted); font-size: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 6; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.18); }

@media (max-width: 760px) {
  .panel { grid-template-columns: 1fr; }
  .panel > div + div { border-left: 0; border-top: 1px solid var(--line); }
  .row { grid-template-columns: 1fr auto auto; grid-template-areas: "num pill link" "it it it"; }
}
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } .bar i { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Picker Training</h1>
      <p class="sub">Choose what goes in each order, how many orders, then Create.</p>
    </div>
    <label class="pin" id="pinWrap" hidden>PIN <input id="pin" type="password" inputmode="numeric" autocomplete="off"></label>
    <div class="tools">
      <span class="status" id="status"><i></i><span>ShipHero</span></span>
      <button class="btn ghost small" id="resetBtn" type="button">Reset station</button>
      <span class="confirm" id="resetConfirm" hidden>
        <span>Restock bins and cancel all open training orders?</span>
        <button class="btn small" id="resetYes" type="button">Reset</button>
        <button class="btn ghost small" id="resetNo" type="button">Keep</button>
      </span>
    </div>
  </header>

  <div class="panel">
    <div>
      <p class="step"><b>1</b> Items in each order</p>
      <div class="seg" role="tablist">
        <button id="modePick" class="on" type="button">Choose items</button>
        <button id="modeRandom" type="button">Random mix</button>
      </div>
      <div id="pickArea">
        <p class="hint">Presets:</p>
        <div class="chips presets" id="presets"></div>
        <div class="plist" id="plist"></div>
      </div>
      <div id="randomArea" class="random-note" hidden>Each order gets 1–4 random products, quantity 1–2 each.</div>
    </div>
    <div>
      <p class="step"><b>2</b> How many orders</p>
      <div class="counter">
        <button type="button" id="dec" aria-label="Fewer">−</button>
        <input id="count" type="number" inputmode="numeric" min="1" max="50" value="1" aria-label="Number of orders">
        <button type="button" id="inc" aria-label="More">+</button>
      </div>
      <div class="chips" id="countChips">
        <button type="button" data-n="1">1</button><button type="button" data-n="5">5</button><button type="button" data-n="10">10</button><button type="button" data-n="20">20</button>
      </div>

      <p class="step" style="margin-top:22px"><b>3</b> Create</p>
      <div class="summary" id="summary"></div>
      <button class="btn" id="go" type="button">Create 1 order</button>
      <div class="bar" id="bar" hidden><i id="barFill"></i></div>
      <div class="result" id="result"></div>
    </div>
  </div>

  <section>
    <p class="step">Recent orders</p>
    <div class="list" id="recent"><div class="empty">Loading…</div></div>
  </section>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const PRESETS = [
  { label: "M&M's + KitKat", lines: { 'SBT-MMS-PEANUT': 1, 'SBT-KITKAT': 1 } },
  { label: 'Trident', lines: { 'SBT-TRIDENT': 1 } },
  { label: "Butterfinger + KitKat + Hershey's", lines: { 'SBT-BUTTERFINGER': 1, 'SBT-KITKAT': 1, 'SBT-HERSHEY-KS': 1 } },
  { label: 'Bubble Tape ×2', lines: { 'SBT-BUBBLETAPE': 2 } },
  { label: "Hershey's ×2 + M&M's ×3 + Trident", lines: { 'SBT-HERSHEY-KS': 2, 'SBT-MMS-PEANUT': 3, 'SBT-TRIDENT': 1 } },
  { label: 'One of each', lines: { 'SBT-HERSHEY-KS': 1, 'SBT-KITKAT': 1, 'SBT-BUTTERFINGER': 1, 'SBT-BUBBLETAPE': 1, 'SBT-MMS-PEANUT': 1, 'SBT-TRIDENT': 1 } },
];
const MAX_ORDERS = 50, CHUNK = 5, MAX_QTY = 5;

let P = {};
let mode = 'pick';
const qty = {};
let lastNumber = '';
let busy = false;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const short = (sku) => (P[sku] && P[sku].short) || sku;
const describe = (lines) => lines.map((l) => short(l.sku) + (l.qty > 1 ? ' ×' + l.qty : '')).join(', ');
const chosen = () => Object.keys(P).filter((s) => qty[s] > 0).map((sku) => ({ sku, qty: qty[sku] }));
const count = () => Math.min(MAX_ORDERS, Math.max(1, parseInt($('count').value, 10) || 1));
const plural = (n) => n === 1 ? '1 order' : n + ' orders';

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 3500);
}
function savePin() { try { localStorage.setItem('pt-pin', $('pin').value); } catch (e) {} }
function loadPin() { try { $('pin').value = localStorage.getItem('pt-pin') || ''; } catch (e) {} }

function renderPresets() {
  $('presets').innerHTML = PRESETS.map((p, i) => `<button type="button" data-p="${i}">${esc(p.label)}</button>`).join('');
}
function renderList() {
  $('plist').innerHTML = Object.entries(P).map(([sku, p]) => `
    <div class="prow${qty[sku] ? ' on' : ''}" data-sku="${sku}">
      <span class="pic"><img src="${p.img}" alt=""></span>
      <span class="nm">${esc(p.name)}</span>
      <span class="stp">
        <button type="button" data-d="-1" aria-label="One less ${esc(p.short)}">−</button>
        <output>${qty[sku] || 0}</output>
        <button type="button" data-d="1" aria-label="One more ${esc(p.short)}">+</button>
      </span>
    </div>`).join('');
  markPreset();
  renderSummary();
}
function markPreset() {
  const cur = JSON.stringify(chosen().map((l) => [l.sku, l.qty]).sort());
  document.querySelectorAll('#presets button').forEach((b) => {
    const p = PRESETS[b.dataset.p];
    const key = JSON.stringify(Object.entries(p.lines).sort());
    b.classList.toggle('on', mode === 'pick' && key === cur);
  });
}
function renderSummary() {
  const n = count();
  const lines = chosen();
  document.querySelectorAll('#countChips button').forEach((b) => b.classList.toggle('on', Number(b.dataset.n) === n));
  const ready = mode === 'random' || lines.length > 0;
  $('summary').textContent = mode === 'random'
    ? `${plural(n)}, each with a random mix`
    : lines.length ? `${plural(n)}, each with ${describe(lines)}` : 'Pick at least one item above.';
  $('go').textContent = busy ? $('go').textContent : `Create ${plural(n)}`;
  $('go').disabled = busy || !ready;
}
function setMode(m) {
  mode = m;
  $('modePick').classList.toggle('on', m === 'pick');
  $('modeRandom').classList.toggle('on', m === 'random');
  $('pickArea').hidden = m !== 'pick';
  $('randomArea').hidden = m !== 'random';
  renderSummary();
}
function setCount(n) { $('count').value = Math.min(MAX_ORDERS, Math.max(1, n)); renderSummary(); }

function pill(status) {
  const s = String(status || '').toLowerCase();
  const cls = s.includes('cancel') ? 'canceled' : ['fulfilled', 'pending', 'training', 'new'].includes(s) ? s : '';
  return `<span class="pill ${cls}">${esc(s || '—')}</span>`;
}
function rowHtml(o, isNew) {
  const link = o.id ? `<a href="https://app.shiphero.com/dashboard/orders/details/${o.id}" target="_blank" rel="noopener">Open ↗</a>` : '<span></span>';
  return `<div class="row${isNew ? ' new' : ''}"><span class="num">${esc(o.number)}</span><span class="it">${esc(describe(o.lines))}</span>${pill(isNew ? 'new' : o.status)}${link}</div>`;
}
function renderRecent(orders) {
  $('recent').innerHTML = orders.length ? orders.slice(0, 12).map((o) => rowHtml(o, false)).join('') : '<div class="empty">No orders yet.</div>';
}
function prependRecent(o) {
  const el = $('recent');
  if (el.querySelector('.empty')) el.innerHTML = '';
  el.insertAdjacentHTML('afterbegin', rowHtml(o, true));
  while (el.children.length > 12) el.lastElementChild.remove();
}
function setStatus(on) {
  const s = $('status');
  s.className = 'status ' + (on ? 'on' : 'off');
  s.lastElementChild.textContent = on ? 'ShipHero' : 'ShipHero offline';
}
function randomOrder() {
  const skus = Object.keys(P).sort(() => Math.random() - 0.5);
  const n = 1 + Math.floor(Math.random() * 4);
  return { lines: skus.slice(0, n).map((sku) => ({ sku, qty: Math.random() < 0.75 ? 1 : 2 })) };
}

async function createAll() {
  if (busy) return;
  const total = count();
  const lines = chosen();
  const orders = mode === 'random'
    ? Array.from({ length: total }, randomOrder)
    : Array.from({ length: total }, () => ({ lines }));
  busy = true;
  const go = $('go'), res = $('result'), bar = $('bar'), fill = $('barFill');
  res.className = 'result'; res.textContent = '';
  bar.hidden = false; fill.style.width = '0%';
  go.disabled = true;
  const made = [];
  let failed = 0, error = '';
  try {
    for (let i = 0; i < orders.length; i += CHUNK) {
      go.innerHTML = `<span class="spin"></span>Creating ${Math.min(i + CHUNK, orders.length)} / ${orders.length}…`;
      const r = await fetch('/api/create-orders', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin: $('pin').value, after: lastNumber, orders: orders.slice(i, i + CHUNK) }),
      });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(body.error || `Error ${r.status}`);
      for (const x of body.results) {
        if (x.ok) { made.push(x); lastNumber = x.order_number; prependRecent({ number: x.order_number, id: x.legacy_id, lines: x.lines }); }
        else { failed++; error = x.error || error; }
      }
      fill.style.width = Math.round(((made.length + failed) / orders.length) * 100) + '%';
    }
  } catch (e) {
    error = e.message;
  }
  busy = false;
  bar.hidden = true;
  if (made.length && !failed && !error) {
    res.className = 'result ok';
    res.textContent = made.length === 1 ? `Created ${made[0].order_number}` : `Created ${made.length} orders: ${made[0].order_number} → ${made[made.length - 1].order_number}`;
    setStatus(true);
  } else if (made.length) {
    res.className = 'result bad';
    res.textContent = `Created ${made.length} of ${orders.length}. ${error}`;
  } else {
    res.className = 'result bad';
    res.textContent = error || 'Nothing was created.';
  }
  renderSummary();
}

async function reset(mode) {
  const r = await fetch('/api/reset', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pin: $('pin').value, mode }),
  });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || `Error ${r.status}`);
  return body;
}
function describeReset(b) {
  const parts = [];
  if (b.cleared.length) parts.push(`${b.cleared.length} tote${b.cleared.length > 1 ? 's' : ''} cleared`);
  if (b.cancelled.length) parts.push(`${b.cancelled.length} order${b.cancelled.length > 1 ? 's' : ''} cancelled`);
  if (b.errors.length) parts.push(`${b.errors.length} failed`);
  return parts.join(', ');
}
async function loadRecent() {
  const rec = await fetch('/api/recent').then((r) => r.json());
  setStatus(Boolean(rec.ok));
  renderRecent(rec.orders || []);
  const top = (rec.orders || []).map((o) => o.number).find((n) => /^TEST-TRAINING-\d+$/.test(n));
  if (top) lastNumber = top;
}
$('resetBtn').addEventListener('click', () => { $('resetBtn').hidden = true; $('resetConfirm').hidden = false; });
$('resetNo').addEventListener('click', () => { $('resetConfirm').hidden = true; $('resetBtn').hidden = false; });
$('resetYes').addEventListener('click', async () => {
  const y = $('resetYes'); y.disabled = true; y.textContent = 'Resetting…';
  try {
    const b = await reset('all');
    toast(describeReset(b) ? 'Reset: ' + describeReset(b) : 'Nothing to reset');
    if (b.errors.length) console.warn(b.errors);
    await loadRecent();
  } catch (e) { toast(e.message); }
  y.disabled = false; y.textContent = 'Reset';
  $('resetConfirm').hidden = true; $('resetBtn').hidden = false;
});

document.addEventListener('click', (e) => {
  const pre = e.target.closest('[data-p]');
  if (pre) { Object.keys(qty).forEach((k) => delete qty[k]); Object.assign(qty, PRESETS[pre.dataset.p].lines); return renderList(); }
  const st = e.target.closest('[data-d]');
  if (st) { const sku = st.closest('[data-sku]').dataset.sku; qty[sku] = Math.max(0, Math.min(MAX_QTY, (qty[sku] || 0) + Number(st.dataset.d))); return renderList(); }
  const cc = e.target.closest('#countChips [data-n]');
  if (cc) return setCount(Number(cc.dataset.n));
});
$('modePick').addEventListener('click', () => setMode('pick'));
$('modeRandom').addEventListener('click', () => setMode('random'));
$('dec').addEventListener('click', () => setCount(count() - 1));
$('inc').addEventListener('click', () => setCount(count() + 1));
$('count').addEventListener('input', renderSummary);
$('count').addEventListener('change', () => setCount(count()));
$('go').addEventListener('click', createAll);
$('pin').addEventListener('input', savePin);

(async () => {
  try {
    const cat = await fetch('/api/catalog').then((r) => r.json());
    P = cat.products;
    $('pinWrap').hidden = !cat.pinRequired;
    loadPin();
    renderPresets();
    Object.assign(qty, PRESETS[0].lines);
    renderList();
  } catch (e) {
    toast('Could not load the product list. Refresh.');
    return;
  }
  // Clean up anything left from a finished session (totes idle 30+ min), then show the list.
  try {
    const b = await reset('auto');
    if (describeReset(b)) toast('Auto-reset: ' + describeReset(b));
  } catch (e) { /* not fatal; the list below still shows the real state */ }
  try {
    await loadRecent();
  } catch (e) {
    setStatus(false);
    renderRecent([]);
  }
})();
</script>
</body>
</html>
